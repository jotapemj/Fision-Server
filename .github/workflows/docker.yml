# Builds the server images and publishes them to GHCR on every version tag.
#   ghcr.io/jotapemj/fision-server:<version>-<variant>  and  :<variant>
#   :latest and :<version> point to cu129.
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cu129, cu126, cpu]
    steps:
      # La imagen CUDA pesa varios GB: el runner trae poco disco libre
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive        # pesos de BTC

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fision-server
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}-${{ matrix.variant }}
            type=raw,value=${{ matrix.variant }}
            type=semver,pattern={{version}},enable=${{ matrix.variant == 'cu129' }}
            type=raw,value=latest,enable=${{ matrix.variant == 'cu129' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: TORCH_INDEX=${{ matrix.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
